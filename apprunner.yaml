version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm ci --only=production
run:
  command: node admin/server.js
  network:
    port: 3001
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "3001"
    - name: EMAIL_PROVIDER
      value: "resend"
    - name: EMAIL_FROM
      value: "onboarding@resend.dev"
